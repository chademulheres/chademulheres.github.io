<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F7F2FB">
<title>Inscritas · Chá de Mulheres</title>
<link rel="icon" href="icon.png">
<link rel="manifest" href="contador.webmanifest">
<link rel="apple-touch-icon" href="img/app-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Inscritas">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Lora:ital,wght@0,400;0,600;1,400&family=Poppins:wght@400;500&display=swap">
<style>
:root{--marsala:#7A4554;--deep:color-mix(in srgb,var(--marsala) 52%,#12080c);--card:color-mix(in srgb,var(--marsala) 34%,#1a0d12);--gold-soft:#E7C9A0;--cream:#FCF5F3;--muted:rgba(252,245,243,.62);--line:rgba(231,201,160,.22)}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:28px 16px;color:var(--cream);font:16px/1.5 Lora,Georgia,serif;text-align:center;background:var(--deep) radial-gradient(ellipse at 50% 30%,color-mix(in srgb,var(--marsala) 75%,transparent),transparent 70%) no-repeat}
img{width:min(80vw,380px);height:auto}
.card{width:min(100%,420px);background:var(--card);border:1px solid var(--line);border-radius:24px;padding:30px 20px 26px;box-shadow:0 14px 40px rgba(0,0,0,.3)}
.rot{font-family:Poppins,system-ui,sans-serif;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-soft)}
.num{font-size:clamp(84px,26vw,128px);font-weight:600;line-height:1;margin:10px 0 2px;color:var(--cream)}
.de{font-family:"Pinyon Script",cursive;font-size:34px;color:var(--gold-soft);line-height:1.1}
.info{color:var(--muted);font-size:15px;margin-top:10px}
.faltam{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);font-family:Poppins,system-ui,sans-serif;font-size:14px;color:var(--gold-soft)}
.at{font-family:Poppins,system-ui,sans-serif;font-size:12px;color:var(--muted)}

/* ===== Tema Lavanda aquarela (igual ao site) ===== */
:root{--deep:#F7F2FB;--card:rgba(255,255,255,.72);--gold-soft:#9474B8;--cream:#4B3F5C;--muted:#8E84A0;--line:rgba(150,120,190,.28);--erro:#B3445A}
body{background:linear-gradient(180deg,#F7F2FB 0%,#FBF8FD 45%,#F3EEF9 100%)!important;color:#4B3F5C}
.card{background:rgba(255,255,255,.72)!important;backdrop-filter:blur(6px);border:1px solid rgba(180,160,210,.35)!important;border-radius:28px!important;box-shadow:0 18px 40px rgba(120,90,160,.10)!important}
.num{color:#4B3F5C!important}
input{background:#fff!important;color:#4B3F5C!important}
button{background:linear-gradient(90deg,#A88BC9,#D7A6C4)!important;color:#fff!important}
a{color:#9474B8}

.ver-lista{margin-top:4px;font:500 15px Poppins,system-ui,sans-serif;border:0;border-radius:999px;padding:12px 24px;cursor:pointer}
.lista{width:min(100%,1000px);background:rgba(255,255,255,.72);border:1px solid rgba(180,160,210,.35);border-radius:22px;padding:20px;text-align:left}
.lista-senha label{display:block;font:500 13px Poppins,system-ui,sans-serif;color:#9474B8;margin-bottom:6px}
.lista-senha div{display:flex;gap:8px}
.lista-senha input{flex:1;min-width:0;font:inherit;padding:11px 14px;border:1.5px solid #E0D3EE;border-radius:14px}
.lista-senha button{font:500 14px Poppins,system-ui,sans-serif;border:0;border-radius:999px;padding:0 20px;cursor:pointer}
.lista-erro{color:#B3445A;font-size:14px;margin:8px 0 0}
.lista-tit{margin:0 0 10px;font:500 14px Poppins,system-ui,sans-serif;color:#9474B8}
.lista-rolar{overflow-x:auto}
.lista table{width:100%;border-collapse:collapse;font:13px Poppins,system-ui,sans-serif;color:#4B3F5C}
.lista th{background:#A88BC9;color:#fff;text-align:left;padding:8px;font-weight:500;white-space:nowrap}
.lista td{padding:7px 8px;border-bottom:1px solid #EDE4F5;vertical-align:top}
.lista tr:nth-child(odd) td{background:#FBF8FD}
</style>
</head>
<body>
<picture><source media="(min-width:700px)" srcset="img/logo-horizontal.png"><img src="img/logo-horizontal.png" alt="Chá de Mulheres – Gerando Testemunho"></picture>
<div class="card">
  <div class="rot">Inscritas até agora</div>
  <div class="num" id="num">–</div>
  <div class="de" id="tema">Chá de Mulheres</div>
  <div class="info" id="info"></div>
  <div class="faltam" id="faltam" hidden></div>
</div>
<div class="at" id="at">Atualizando...</div>
<button class="ver-lista" id="ver-lista" type="button">📋 Ver a lista das inscritas</button>
<div class="lista" id="lista" hidden>
  <form id="f-lista" class="lista-senha">
    <label for="lista-senha">Senha da lista</label>
    <div><input id="lista-senha" type="password" autocomplete="current-password" placeholder="Digite a senha"><button type="submit">Ver lista</button></div>
    <p class="lista-erro" id="lista-erro" hidden></p>
  </form>
  <div id="lista-tab" hidden>
    <p class="lista-tit" id="lista-tit"></p>
    <div class="lista-rolar"><table id="tab"></table></div>
  </div>
</div>
<script src="config.js"></script>
<script>
const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const DIAS=["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"];
function mostrar(c){
  if(!c) return;
  // o tema é fixo (lavanda); a cor do Chá não muda mais as cores do contador
  if(typeof c.total==="number") document.getElementById("num").textContent=c.total;
  document.getElementById("tema").textContent=c.tema||"Chá de Mulheres";
  if(c.data){
    const [y,m,d]=c.data.split("-").map(Number);
    document.getElementById("info").textContent=DIAS[new Date(y,m-1,d).getDay()]+", "+d+" de "+MESES[m-1]+(c.hora?" · "+c.hora:"");
    const hoje=new Date(); const dias=Math.round((new Date(y,m-1,d)-new Date(hoje.getFullYear(),hoje.getMonth(),hoje.getDate()))/864e5);
    const f=document.getElementById("faltam"); f.hidden=dias<0;
    f.textContent=dias===0?"É hoje! 🌷":dias===1?"Falta 1 dia":"Faltam "+dias+" dias";
  }
}
async function atualizar(){
  try{
    const c=await (await fetch(window.CHA_CONFIG_URL,{cache:"no-store"})).json();
    mostrar(c); try{localStorage.setItem("cha-config",JSON.stringify(c));}catch(_){}
    document.getElementById("at").textContent="Atualizado às "+new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})+" · atualiza sozinho a cada minuto";
  }catch(e){document.getElementById("at").textContent="Sem conexão agora. Tentando de novo em 1 minuto...";}
}
try{mostrar(JSON.parse(localStorage.getItem("cha-config")||"null"));}catch(_){}
atualizar(); setInterval(atualizar,60000);

// Lista das inscritas: precisa da senha da lista (ou a da administração). Os nomes não ficam no contador sem a senha.
let senhaLista = ""; try { senhaLista = sessionStorage.getItem("cha-lista") || ""; } catch (_) {}
document.getElementById("ver-lista").addEventListener("click", () => {
  const l = document.getElementById("lista"); l.hidden = !l.hidden;
  if (!l.hidden && senhaLista) carregarLista(); else if (!l.hidden) document.getElementById("lista-senha").focus();
});
document.getElementById("f-lista").addEventListener("submit", e => { e.preventDefault(); senhaLista = document.getElementById("lista-senha").value; carregarLista(); });
async function carregarLista() {
  const erro = document.getElementById("lista-erro"); erro.hidden = true;
  try {
    const r = await (await fetch(window.CHA_CONFIG_URL, { method: "POST", body: JSON.stringify({ acao: "lista_contador", senha: senhaLista }) })).json();
    if (!r.ok) { erro.textContent = r.erro; erro.hidden = false; senhaLista = ""; try { sessionStorage.removeItem("cha-lista"); } catch (_) {} return; }
    try { sessionStorage.setItem("cha-lista", senhaLista); } catch (_) {}
    const L = r.lista, t = document.getElementById("tab");
    document.getElementById("f-lista").hidden = true; document.getElementById("lista-tab").hidden = false;
    document.getElementById("lista-tit").textContent = L.linhas.length + (L.linhas.length === 1 ? " inscrita" : " inscritas") + " · " + L.titulo;
    t.innerHTML = "";
    const tr0 = document.createElement("tr"); ["Nº"].concat(L.cab).forEach(c => { const th = document.createElement("th"); th.textContent = c; tr0.appendChild(th); });
    t.appendChild(tr0);
    L.linhas.forEach((l, i) => { const tr = document.createElement("tr"); [String(i + 1)].concat(l).forEach(c => { const td = document.createElement("td"); td.textContent = c; tr.appendChild(td); }); t.appendChild(tr); });
  } catch (e) { erro.textContent = "Sem conexão agora. Tente de novo."; erro.hidden = false; }
}
</script>
</body>
</html>
